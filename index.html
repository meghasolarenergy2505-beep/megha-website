<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Megha Associates — Solar &amp; Real Estate, Durg | ज़मीन से आसमान तक</title>
<meta name="description" content="Megha Associates, Durg (C.G.) — rooftop solar, solar power plants & borewell solar pumps with Satvik, Waaree & Adani panels. Govt subsidy up to ₹1,08,000. Plus agriculture, commercial & residential land." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A2540;--ink-2:#123a63;--sun:#F6B400;--sun-deep:#E08A00;
  --land:#1C7C43;--land-deep:#14602f;--paper:#FBFAF6;--paper-2:#F2EEE4;
  --line:#E4DECF;--slate:#3A4757;--muted:#6B7785;--white:#fff;--wa:#25D366;
  --shadow:0 18px 50px -22px rgba(10,37,64,.45);--maxw:1200px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Manrope",system-ui,sans-serif;color:var(--slate);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;}
.dev{font-family:"Noto Sans Devanagari","Manrope",sans-serif}
h1,h2,h3,h4,h5{font-family:"Sora",sans-serif;color:var(--ink);line-height:1.14;margin:0;letter-spacing:-.02em;font-weight:700}
p{margin:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
.sec{padding:80px 0}
.eyebrow{font-family:"Sora";font-weight:600;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--sun-deep)}
.eyebrow.green{color:var(--land)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;gap:.55rem;font-family:"Sora";font-weight:600;font-size:.95rem;padding:.85rem 1.4rem;border-radius:999px;border:0;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn-sun{background:var(--sun);color:var(--ink);box-shadow:0 10px 24px -10px rgba(224,138,0,.7)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff}
.btn-line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-green{background:var(--land);color:#fff;box-shadow:0 10px 24px -10px rgba(20,96,47,.7)}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 10px 24px -10px rgba(37,211,102,.6)}
.head{max-width:48rem;margin:0 auto 48px;text-align:center}
.head.left{margin-left:0;text-align:left}
.head h2{font-size:clamp(1.8rem,3.6vw,2.6rem);margin-top:14px}
.head p{margin-top:14px;color:var(--muted);font-size:1.05rem}
.topbar{background:var(--ink);color:#cdd9e6;font-size:.84rem}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;height:42px;gap:18px}
.topbar .left{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.topbar a{display:inline-flex;align-items:center;gap:7px;color:#cdd9e6}
.topbar a:hover{color:#fff}
.topbar .wa-link{color:#7fe6a3}
.topbar .socials{display:flex;gap:12px}
.topbar .socials a{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.1);display:grid;place-items:center}
.topbar .socials a:hover{background:var(--sun);color:var(--ink)}
.topbar .sep{opacity:.3}
header{position:sticky;top:0;z-index:60;background:rgba(251,250,246,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:74px}
.brand{display:flex;align-items:center;gap:.7rem}
.logo{width:46px;height:46px;flex:none}
.brand b{font-family:"Sora";font-weight:800;color:var(--ink);font-size:1.2rem;letter-spacing:-.03em;line-height:1}
.brand small{display:block;font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px}
.navlinks{display:flex;align-items:center;gap:.4rem}
.navlinks>a,.navlinks .dd>span{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:.93rem;color:var(--ink);opacity:.85;padding:10px 14px;border-radius:10px;cursor:pointer}
.navlinks>a:hover,.navlinks .dd:hover>span{opacity:1;background:var(--paper-2)}
.dd{position:relative}
.dd .menu{position:absolute;top:100%;left:0;min-width:230px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;opacity:0;visibility:hidden;transform:translateY(8px);transition:.18s;z-index:70}
.dd:hover .menu{opacity:1;visibility:visible;transform:translateY(4px)}
.dd .menu a{display:block;padding:10px 12px;border-radius:9px;font-size:.9rem;font-weight:600;color:var(--ink)}
.dd .menu a:hover{background:var(--paper-2);color:var(--sun-deep)}
.dd .menu small{display:block;font-weight:500;color:var(--muted);font-size:.78rem;margin-top:1px}
.navcta{margin-left:8px}
.menubtn{display:none;background:none;border:0;cursor:pointer;padding:8px}
.menubtn span{display:block;width:24px;height:2px;background:var(--ink);margin:5px 0;border-radius:2px}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 80% -10%, #1b4a7d 0%, var(--ink) 46%, #071a30 100%);color:#fff}
.hero .wrap{position:relative;z-index:3;padding-top:74px;padding-bottom:84px}
.sun-arc{position:absolute;right:-6%;top:-24%;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(246,180,0,.95) 0%,rgba(246,180,0,.5) 38%,rgba(246,180,0,0) 70%);filter:blur(2px);z-index:1}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:42px;align-items:center}
.hero h1{color:#fff;font-size:clamp(2.3rem,5vw,3.7rem);font-weight:800}
.hero h1 .gold{color:var(--sun)}
.hero .lede{margin-top:18px;font-size:1.1rem;color:#cfe0f0;max-width:32rem}
.hero .cta-row{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.hero .mini{margin-top:22px;font-size:.88rem;color:#9fb8d0;display:flex;align-items:center;gap:8px}
.subcard{background:#fff;color:var(--ink);border-radius:22px;padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.subcard:before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(246,180,0,.12),transparent 60%)}
.subcard .tag{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--land);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.05em;padding:5px 12px;border-radius:999px}
.subcard h3{position:relative;font-size:1.05rem;margin-top:14px;color:var(--ink-2);font-weight:600}
.subcard .big{position:relative;font-family:"Sora";font-weight:800;font-size:3rem;color:var(--ink);margin:4px 0 2px}
.subcard .big small{font-size:1rem;color:var(--muted);font-weight:600}
.subcard ul{position:relative;list-style:none;padding:0;margin:16px 0 0;display:grid;gap:9px}
.subcard li{display:flex;align-items:center;gap:9px;font-size:.92rem;color:var(--slate);font-weight:500}
.badges{background:#fff;border-bottom:1px solid var(--line)}
.badges .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.badge{display:flex;align-items:center;gap:16px;padding:30px 26px;border-right:1px solid var(--line)}
.badge:last-child{border-right:0}
.badge .bic{width:52px;height:52px;border-radius:14px;background:rgba(246,180,0,.14);display:grid;place-items:center;flex:none}
.badge h4{font-size:1.05rem}
.badge p{font-size:.86rem;color:var(--muted)}
.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.why-list{list-style:none;padding:0;margin:22px 0 26px;display:grid;gap:14px}
.why-list li{display:flex;gap:12px;align-items:flex-start}
.why-list .tick{width:26px;height:26px;border-radius:8px;background:rgba(28,124,67,.12);display:grid;place-items:center;flex:none;margin-top:2px}
.why-list b{color:var(--ink);font-family:"Sora";font-size:.98rem}
.why-list span{color:var(--muted);font-size:.92rem}
.why-visual{position:relative;border-radius:24px;overflow:hidden;min-height:380px;background:linear-gradient(150deg,#14406e,#0a2540);display:grid;place-items:center}
.why-visual .vsun{position:absolute;top:-40px;right:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(246,180,0,.9),rgba(246,180,0,0) 70%)}
.why-visual .vhouse{position:relative;z-index:2}
.exp-badge{position:absolute;left:24px;bottom:24px;background:var(--sun);color:var(--ink);border-radius:16px;padding:16px 22px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);z-index:3}
.exp-badge b{font-family:"Sora";font-size:1.8rem;display:block;line-height:1}
.exp-badge span{font-size:.8rem;font-weight:600}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.scard{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .18s,box-shadow .2s;display:flex;flex-direction:column}
.scard:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.scard .stop{height:96px;display:grid;place-items:center;position:relative}
.scard .stop.solar{background:linear-gradient(140deg,#14406e,#0a2540)}
.scard .stop.gold{background:linear-gradient(140deg,#f6b400,#c97e00)}
.scard .stop.plant{background:linear-gradient(140deg,#1b4a7d,#0a2540)}
.scard .stop.agri{background:linear-gradient(140deg,#2aa35a,#14602f)}
.scard .stop.comm{background:linear-gradient(140deg,#2b6cb0,#0a2540)}
.scard .stop.resi{background:linear-gradient(140deg,#E08A00,#9c5b00)}
.scard .sbody{padding:24px;flex:1;display:flex;flex-direction:column}
.scard .pill{position:absolute;top:14px;left:16px;font-family:"Sora";font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px}
.scard h4{font-size:1.2rem;margin-bottom:8px}
.scard p{color:var(--muted);font-size:.93rem;flex:1}
.scard .more{margin-top:16px;font-family:"Sora";font-weight:600;font-size:.9rem;color:var(--sun-deep);display:inline-flex;align-items:center;gap:6px}
.scard.green .more{color:var(--land)}
.brands{background:var(--paper-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.brands .wrap{padding:42px 22px}
.brand-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:22px}
.brand-chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 26px;font-family:"Sora";font-weight:700;color:var(--ink);font-size:1.05rem;letter-spacing:.02em}
.brand-chip small{display:block;font-family:"Manrope";font-weight:500;font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.stats{background:var(--ink);color:#fff}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:56px 22px}
.stat{text-align:center}
.stat b{font-family:"Sora";font-weight:800;font-size:2.6rem;color:var(--sun);display:block;line-height:1}
.stat span{color:#aebfd2;font-size:.92rem;margin-top:8px;display:block}
.estimate{background:#fff;border:1px solid var(--line);border-radius:26px;padding:42px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;box-shadow:var(--shadow)}
.estimate h3{font-size:1.5rem}
.estimate label{font-size:.82rem;color:var(--muted);font-weight:600;display:block;margin-bottom:8px;letter-spacing:.03em}
.estimate .ipt{display:flex;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.estimate .ipt span{color:var(--sun-deep);font-family:"Sora";font-weight:700;font-size:1.1rem}
.estimate input[type=number]{flex:1;background:none;border:0;color:var(--ink);font-size:1.4rem;font-family:"Sora";font-weight:700;padding:14px 8px;width:100%}
.estimate input:focus{outline:none}
.est-out{background:var(--ink);border-radius:18px;padding:26px;color:#fff}
.est-out .row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.14)}
.est-out .row:last-child{border:0}
.est-out .row b{font-family:"Sora";font-size:1.45rem;color:var(--sun)}
.est-out .row span{color:#cdd9e6;font-size:.92rem}
.disc{font-size:.76rem;color:var(--muted);margin-top:14px}
.strip{background:var(--paper-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip .wrap{display:flex;flex-wrap:wrap;gap:26px;justify-content:space-between;padding:40px 22px}
.strip div{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--ink);font-size:.95rem}
.strip .ic{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.tcar{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 16px;-webkit-overflow-scrolling:touch}
.tcar::-webkit-scrollbar{height:8px}
.tcar::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.tcard{scroll-snap-align:start;flex:0 0 360px;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}
.tcard .stars{color:var(--sun);letter-spacing:2px;margin-bottom:12px}
.tcard p{color:var(--slate);font-size:.96rem;font-style:italic}
.tcard .who{display:flex;align-items:center;gap:12px;margin-top:18px}
.tcard .av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:"Sora";font-weight:700;flex:none}
.tcard .who b{font-family:"Sora";color:var(--ink);font-size:.95rem;display:block}
.tcard .who span{color:var(--muted);font-size:.84rem}
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .18s,box-shadow .2s}
.bcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.bcard .bimg{height:150px;display:grid;place-items:center;color:#fff}
.bcard .bimg.a{background:linear-gradient(140deg,#f6b400,#c97e00)}
.bcard .bimg.b{background:linear-gradient(140deg,#14406e,#0a2540)}
.bcard .bimg.c{background:linear-gradient(140deg,#2aa35a,#14602f)}
.bcard .bbody{padding:22px}
.bcard .btag{font-family:"Sora";font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sun-deep)}
.bcard h4{font-size:1.1rem;margin:8px 0 8px}
.bcard p{color:var(--muted);font-size:.9rem}
.bcard .more{margin-top:14px;font-family:"Sora";font-weight:600;font-size:.88rem;color:var(--ink);display:inline-flex;gap:6px}
.ctaband{background:linear-gradient(150deg,#14406e,#0a2540);color:#fff;border-radius:26px;padding:48px;display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap;position:relative;overflow:hidden}
.ctaband:before{content:"";position:absolute;right:-30px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(246,180,0,.35),transparent 70%)}
.ctaband h3{color:#fff;font-size:1.8rem;position:relative}
.ctaband p{color:#cfe0f0;margin-top:8px;position:relative}
.ctaband .acts{display:flex;gap:14px;position:relative;flex-wrap:wrap}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.cinfo .row{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.cinfo .ic{width:46px;height:46px;border-radius:13px;background:var(--ink);display:grid;place-items:center;flex:none}
.cinfo .row b{display:block;font-family:"Sora";color:var(--ink);font-size:1.02rem}
.cinfo .row span{color:var(--muted);font-size:.93rem}
.cform{background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:var(--shadow)}
.cform h3{font-size:1.35rem;margin-bottom:6px}
.cform p{color:var(--muted);font-size:.92rem;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{font-size:.82rem;font-weight:600;color:var(--ink);display:block;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:.95rem;background:var(--paper)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sun);box-shadow:0 0 0 3px rgba(246,180,0,.18)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
footer{background:var(--ink);color:#cdd9e6;padding:60px 0 26px}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:34px;margin-bottom:36px}
footer h4{color:#fff;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:16px}
footer a.fl{display:block;color:#9fb3c8;padding:5px 0;font-size:.92rem}
footer a.fl:hover{color:var(--sun)}
.fbrand b{font-family:"Sora";font-weight:800;color:#fff;font-size:1.3rem}
.fbrand p{color:#9fb3c8;font-size:.9rem;margin-top:12px;max-width:24rem}
.fsoc{display:flex;gap:10px;margin-top:16px}
.fsoc a{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.1);display:grid;place-items:center}
.fsoc a:hover{background:var(--sun);color:var(--ink)}
.areas{border-top:1px solid rgba(255,255,255,.1);padding-top:22px;margin-bottom:18px}
.areas h4{margin-bottom:10px}
.areas span{color:#9fb3c8;font-size:.88rem}
.fbot{border-top:1px solid rgba(255,255,255,.1);padding-top:22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:.84rem;color:#7f93a8}
.ownerlink{cursor:pointer;color:#7f93a8}
.ownerlink:hover{color:var(--sun)}
.fab{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.wa-widget{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 7px 7px 16px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);text-decoration:none}
.wa-widget span{font-family:"Sora";font-weight:600;font-size:.9rem;color:var(--ink)}
.wa-widget .ico{width:44px;height:44px;border-radius:50%;background:var(--wa);display:grid;place-items:center;flex:none}
.fab .call{width:52px;height:52px;border-radius:50%;background:var(--ink);display:grid;place-items:center;align-self:flex-end;box-shadow:0 12px 28px -8px rgba(0,0,0,.4)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(7,20,38,.6);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--paper);border-radius:22px;width:100%;max-width:960px;box-shadow:0 40px 90px -30px rgba(0,0,0,.6);overflow:hidden}
.modal-head{background:var(--ink);color:#fff;padding:20px 26px;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{color:#fff;font-size:1.15rem}
.modal-head .x{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:1.1rem}
.modal-body{padding:26px}

/* GATE & BUILDER */
.gate{max-width:380px;margin:20px auto;text-align:center}
.gate .lock{width:60px;height:60px;border-radius:16px;background:rgba(246,180,0,.16);display:grid;place-items:center;margin:0 auto 16px}
.gate h4{font-size:1.3rem;margin-bottom:6px}
.gate p{color:var(--muted);font-size:.92rem;margin-bottom:20px}
.gate input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;font-size:1rem;text-align:center;letter-spacing:.1em}
.gate .err{color:#c0392b;font-size:.85rem;margin-top:10px;min-height:18px}
.lockout-msg{background:#fff0f0;border:1px solid #ffcccc;border-radius:12px;padding:16px;color:#c0392b;font-size:.9rem;margin-top:12px;display:none}
.tabs{display:flex;gap:8px;margin-bottom:22px;background:var(--paper-2);padding:5px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-family:"Sora";font-weight:600;cursor:pointer;color:var(--muted);font-size:.88rem}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.15)}
.builder label{font-size:.78rem;font-weight:600;color:var(--ink);display:block;margin-bottom:5px}

const OWNER_PASSWORD = "megha@2025";

const MAX_ATTEMPTS = 3, LOCK_MINS = 5;

function openModal(){ overlay.classList.add('show'); document.body.style.overflow='hidden'; }

function tryLogin(){
  if(Date.now() < lockUntil) return;
  const pw = document.getElementById('pw').value.trim();
  const errEl = document.getElementById('pwerr');

  if(pw === OWNER_PASSWORD){
    gate.classList.add('hidden');
    builder.classList.remove('hidden');
    document.getElementById('modaltitle').textContent = '🧾 Owner Panel';
    // Initialize forms
    renderRows(); calcTotals(); renderRRows(); calcRTotal();
    startSessionTimer();
  } else {
    failCount++;
    if(failCount >= MAX_ATTEMPTS){
      lockUntil = Date.now() + LOCK_MINS*60*1000;
      document.getElementById('lockoutMsg').style.display = 'block';
      document.getElementById('loginbtn').disabled = true;
      startLockTimer();
    } else {
      errEl.textContent = `Wrong password. ${MAX_ATTEMPTS - failCount} attempts left.`;
    }
  }
}

document.getElementById('loginbtn').addEventListener('click', tryLogin);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') tryLogin(); });
